# PAR2 redundancy (recovery vs payload) before writing verified trees + parity to LTFS/tape.
# Tier letter comes from registry.yaml (`tier`) keyed by hf_repo. Unknown → non-A band.

tier_a:
  # Larger Tier-A checkpoints use lower % to save tape capacity (still ≥ non-A at same size).
  tiers_by_size_gib:
    - max_model_gib: 200
      par2_fraction: 0.25
    - max_model_gib: 500
      par2_fraction: 0.20
    - max_model_gib: 1000000
      par2_fraction: 0.15

non_a:
  tiers_by_size_gib:
    - max_model_gib: 50
      par2_fraction: 0.15
    - max_model_gib: 1000000
      par2_fraction: 0.10

# Whole-volume / directory bundles (specialist/, uncensored/, quantized/) — not tier-A frontier masters.
directory_pool_par2_fraction:
  specialist: 0.12
  ablated: 0.10
  quantized: 0.10

d5_system_snapshot:
  # Full filesystem image (excluding /.tmp); PAR2 optional — default none at volume scope.
  par2_fraction: 0
