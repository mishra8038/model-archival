# Measured on k80-ollama (ubuntu@192.168.8.32), mounts /mnt/models-d{1,2,3,5}.
# 2026-04-30 post-consolidation: vLLM + Ollama live on D5; supermicro mirror moved off D5 to D1.
# Paths in jobs are logical drives (d1–d5) for operators; actual host paths use hyphen (models-d1).
# Update after large downloads / layout changes.

tape_capacity_bytes: 1450000000000   # 1.45 TB decimal — hard pack ceiling per cartridge

d5:
  # df -B1 /mnt/models-d5 (ext4 ~916 GiB volume)
  volume_total_bytes: 983350071296
  # /.tmp removed on host (was ~74 GiB staging); nothing excluded from volume image
  tmp_exclude_bytes: 0

directory_jobs:
  specialist:
    - drive: d1
      rel_path: specialist
      bytes: 164620620490
    - drive: d3
      rel_path: specialist
      bytes: 773832881958
  ablated:
    # uncensored / abliterated trees (d1 tree negligible on disk)
    - drive: d2
      rel_path: uncensored
      bytes: 596814150228
    - drive: d3
      rel_path: uncensored
      bytes: 595895577475
  # GGUF / quantized runnable stack — expect frequent refreshes; version tapes (HOME-01…), do not mix with long-retention Tier-A masters.
  self_hosted:
    alias_of: quantized
    refresh_expectation: high
    tape_label_prefix: HOME
    jobs:
      - drive: d2
        rel_path: quantized
        bytes: 159852285636
      - drive: d3
        rel_path: quantized
        bytes: 499349611039
