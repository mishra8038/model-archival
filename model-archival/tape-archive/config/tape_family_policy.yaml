# Tape packing: keep related checkpoints together so you can refresh or retire them as a unit.
#
# 1) family (org / product line — see org_splits)
# 2) version cohort: same family + same logical version (e.g. gemma-4-31B + gemma-4-31B-it),
#    computed by stripping common chat/base/pt suffixes from the HF model id.

strategy: organization

# Tier-A raw HF snapshots: how to pack version cohorts onto tapes.
# - exclusive: one cohort per tape whenever the cohort fits under capacity (many tapes, max isolation).
# - ffd: first-fit decreasing across all Tier-A cohorts (fewest tapes; may mix orgs on one tape).
# - ffd_same_family: FFD but only merge cohorts that share the same family_label (see org_splits).
tier_a_packing:
  mode: ffd

# After Tier-A / non-A / directory atoms are formed, merge all atoms onto tapes with one
# global first-fit-decreasing pass (share slack across profiles). ~ceil(total_PAR2_bytes / cap) tapes.
# Set false to keep separate A-/R-/SPE-/ABL-/HOME- tape series (more cartridges, simpler labels).
tape_packing:
  cross_profile_ffd: true

# Longest-first strip order matters (e.g. -Instruct-1M before -Instruct).
version_cohort:
  strip_suffixes:
    - "-Instruct-1M"
    - "-Instruct-hf"
    - "-Instruct"
    - "-instruct"
    - "-IT"
    - "-it"
    - "-Chat"
    - "-chat"
    - "-Base"
    - "-base"
    - "-pt"
    - "-PT"
    - "-hf"
    - "-HF"

# Finer splits when a single org mixes unrelated flagship lines.
org_splits:
  meta-llama:
    - match_prefix: Llama-4
      family_label: meta-llama/llama4
    - match_prefix: Llama-3
      family_label: meta-llama/llama3
    - match_prefix: Llama-Guard
      family_label: meta-llama/guard
    - family_label: meta-llama/other

  google:
    - match_prefix: gemma-4
      family_label: google/gemma4
    - match_prefix: gemma-3
      family_label: google/gemma3
    - match_prefix: gemma-2
      family_label: google/gemma2
    - match_prefix: medgemma
      family_label: google/medgemma
    - match_prefix: recurrentgemma
      family_label: google/recurrentgemma
    - family_label: google/other

  Qwen:
    - match_prefix: Qwen3
      family_label: Qwen/qwen3_line
    - match_prefix: Qwen2.5
      family_label: Qwen/qwen25_line
    - family_label: Qwen/other

  deepseek-ai:
    - match_prefix: DeepSeek-Coder
      family_label: deepseek-ai/coder
    - match_prefix: deepseek-coder
      family_label: deepseek-ai/coder_legacy
    - match_prefix: DeepSeek-R1
      family_label: deepseek-ai/r1_line
    - match_prefix: DeepSeek-V3
      family_label: deepseek-ai/v3_line
    - family_label: deepseek-ai/other
