[project]
name = "full-stack-archive"
version = "0.1.0"
description = "Manifest-driven software seed vault for local AI stack archival"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
full-stack-archive = "full_stack_archive.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/full_stack_archive"]
