manifest_version: "1.0"
archive_date: "2026-03-18"
description: "Compatibility matrix for releases that are meaningfully constrained by Ubuntu, GCC, Python, CUDA, and Torch epochs."

compatibility_classes:
  epoch_pinned:
    - pytorch
    - xformers
    - flash-attn
    - bitsandbytes
    - vllm
    - tensorrt-llm
    - deepspeed
    - apex
  python_pinned:
    - transformers
    - accelerate
    - peft
    - trl
    - tokenizers
    - sentencepiece
    - safetensors
  source_first:
    - llama.cpp
    - whisper.cpp
    - koboldcpp
    - open-webui
    - anythingllm

epoch_requirements:
  E0:
    role: "legacy-deep"
    os: ["ubuntu-18.04.6-live-server-amd64.iso"]
    driver: ["440.x", "450.x"]
    cuda: ["10.2"]
    gcc: ["7", "8"]
    python: ["3.8"]
    required_software:
      - "pytorch 1.12.1+cu102"
      - "torchvision 0.13.1"
      - "torchaudio 0.12.1"
      - "transformers 4.30.2"
      - "accelerate 0.21.0"
      - "tokenizers 0.13.3"
      - "sentencepiece 0.1.99"
      - "llama-cpp-python 0.1.78"
    notes:
      - "Preserve older Pascal/Volta-compatible rebuild path."
      - "Do not assume modern kernels or glibc."
  E1:
    role: "early-11-bridge"
    os: ["ubuntu-20.04.6-live-server-amd64.iso"]
    driver: ["470.x"]
    cuda: ["11.3"]
    gcc: ["9"]
    python: ["3.8", "3.9"]
    required_software:
      - "pytorch 1.13.1+cu113"
      - "torchvision 0.14.1"
      - "torchaudio 0.13.1"
      - "transformers 4.33.3"
      - "accelerate 0.23.0"
      - "tokenizers 0.14.1"
      - "bitsandbytes 0.39.0"
    notes:
      - "Bridge stack for early Ampere-era assumptions."
  E2:
    role: "broad-safe"
    os:
      - "ubuntu-20.04.6-live-server-amd64.iso"
      - "ubuntu-22.04.4-live-server-amd64.iso"
    driver: ["525.x"]
    cuda: ["11.8"]
    gcc: ["10", "11"]
    python: ["3.10"]
    required_software:
      - "docker-ce 24.x"
      - "podman 4.4.x"
      - "k3s 1.28.x"
      - "openjdk 17"
      - "go 1.21.x"
      - "rust 1.75.0"
      - "clang/llvm 16.x"
      - "cmake 3.27.x"
      - "pytorch 2.1.2+cu118"
      - "torchvision 0.16.2"
      - "torchaudio 2.1.2"
      - "xformers 0.0.23.post1"
      - "bitsandbytes 0.42.0"
      - "transformers 4.39.3"
      - "accelerate 0.28.0"
      - "llama.cpp b3500-era"
      - "deepspeed 0.10.x"
    notes:
      - "Most reusable long-lived CUDA 11 baseline."
  E3:
    role: "mainline-stable"
    os: ["ubuntu-22.04.4-live-server-amd64.iso"]
    driver: ["535.x"]
    cuda: ["12.1"]
    gcc: ["11"]
    python: ["3.10", "3.11"]
    required_software:
      - "docker-ce 26.x"
      - "podman 4.9.x"
      - "k3s 1.30.x"
      - "openjdk 17 or 21"
      - "maven 3.9.x"
      - "go 1.22.x"
      - "rust 1.75.x"
      - "clang/llvm 17.x"
      - "cmake 3.30.x"
      - "pytorch 2.2.1+cu121"
      - "torchvision 0.17.1"
      - "torchaudio 2.2.1"
      - "xformers 0.0.25.post1"
      - "flash-attn 2.5.8"
      - "bitsandbytes 0.43.1"
      - "vllm 0.4.0.post1"
      - "tensorrt-llm 1.2.x"
      - "ollama 0.3.x"
      - "text-generation-inference 2.x"
    notes:
      - "Stable CUDA 12.1 baseline."
  E4:
    role: "forward-stable"
    os:
      - "ubuntu-24.04.2-live-server-amd64.iso"
      - "ubuntu-24.04.1-live-server-amd64.iso"
    driver: ["570.86.16", "550.x"]
    cuda: ["12.8.0", "12.4"]
    gcc: ["13"]
    python: ["3.11", "3.12"]
    required_software:
      - "docker-ce 27.x"
      - "podman 5.2.x"
      - "k3s 1.31.x"
      - "openjdk 21"
      - "maven 3.9.x"
      - "gradle 8.12.x"
      - "go 1.23.x"
      - "rust 1.85.0"
      - "clang/llvm 19.1.x"
      - "cmake 4.0.x"
      - "pytorch 2.6.0+cu128"
      - "pytorch 2.5.1+cu124"
      - "torchvision 0.21.0+cu128"
      - "torchaudio 2.6.0+cu128"
      - "xformers 0.0.28.post3"
      - "flash-attn 2.7.4.post1"
      - "bitsandbytes 0.45.2"
      - "vllm 0.7.3"
      - "tensorrt-llm 1.3.x"
      - "ollama 0.6.x"
      - "llama.cpp b5000+"
      - "transformers 4.50.x"
      - "open-webui 0.5.x"
      - "anythingllm 1.7.x"
    notes:
      - "Forward reference stack from the merged BOM."

projects:
  - project: pytorch
    releases:
      - version: "1.12.1+cu102"
        supported_epochs: ["E0"]
        ubuntu: ["18.04"]
        python: ["3.8"]
        gcc: ["7", "8"]
        cuda: ["10.2"]
        notes: "Legacy anchor for CUDA 10.2 rebuilds."
      - version: "1.13.1+cu113"
        supported_epochs: ["E1"]
        ubuntu: ["20.04"]
        python: ["3.8", "3.9"]
        gcc: ["9"]
        cuda: ["11.3"]
      - version: "2.1.2+cu118"
        supported_epochs: ["E2"]
        ubuntu: ["20.04", "22.04"]
        python: ["3.10"]
        gcc: ["10", "11"]
        cuda: ["11.8"]
      - version: "2.2.1+cu121"
        supported_epochs: ["E3"]
        ubuntu: ["22.04"]
        python: ["3.10", "3.11"]
        gcc: ["11"]
        cuda: ["12.1"]
      - version: "2.5.1+cu124"
        supported_epochs: ["E4"]
        ubuntu: ["24.04"]
        python: ["3.11"]
        gcc: ["13"]
        cuda: ["12.4"]
      - version: "2.6.0+cu128"
        supported_epochs: ["E4"]
        ubuntu: ["24.04"]
        python: ["3.11", "3.12"]
        gcc: ["13"]
        cuda: ["12.8"]

  - project: xformers
