manifest_version: "1.0"
archive_date: "2026-03-18"
default_destination: "/mnt/models/d5/full-stack-archives"
description: "Expansive catalog of software to archive for self-hosted NVIDIA local AI stacks."

artifact_policy:
  required_formats:
    - source_release
    - git_mirror
    - deb_packages
    - rpm_packages
    - arch_packages
  additional_formats:
    - python_wheels
    - python_sdists
    - container_images
    - runfiles
    - iso_images
    - release_notes
    - checksums
  package_rule: "Archive deb/rpm/arch package forms wherever they exist; when a project is primarily source- or wheel-distributed, preserve the canonical artifact and record package-form status in notes."

categories:
  - id: os
    description: "Operating systems, package feeds, and release metadata."
  - id: nvidia-low-level
    description: "Drivers, CUDA, math libraries, and GPU container runtime."
  - id: compilers-toolchains
    description: "Compiler, linker, and language-toolchain foundations required to rebuild old stacks."
  - id: containers-infra
    description: "Container runtime, registries, and packaging support."
  - id: kubernetes-orchestration
    description: "Kubernetes and lightweight cluster tooling for self-hosted inference services."
  - id: python-runtime
    description: "Core Python ML runtime libraries and model-loading stack."
  - id: inference-serving
    description: "LLM inference engines, OpenAI-compatible servers, and runtime alternates."
  - id: ui-orchestration
    description: "Desktop, web, and workflow layers around local AI services."
  - id: training-finetuning
    description: "Fine-tuning, quantization, and training helpers."
  - id: retrieval-data
    description: "RAG frameworks, vector stores, and document ingestion."
  - id: speech-multimodal
    description: "Speech, vision, and OCR adjuncts."
  - id: eval-observability
    description: "Evaluation, tracing, and metrics."
  - id: legacy-specialized
    description: "Older or specialized stacks worth preserving."

projects:
  - id: ubuntu-server
    category: os
    priority: critical
    supported_epochs: ["E0", "E1", "E2", "E3", "E4"]
    upstream:
      home: "https://releases.ubuntu.com/"
      old_releases: "https://old-releases.ubuntu.com/releases/"
    desired_formats:
      required: ["iso_images", "checksums", "release_notes"]
      when_available: ["deb_packages"]
    notes: "Preserve 18.04.6, 20.04.6, 22.04.4, 24.04.1, and 24.04.2."

  - id: nvidia-driver
    category: nvidia-low-level
    priority: critical
    supported_epochs: ["E0", "E1", "E2", "E3", "E4"]
    upstream:
      home: "https://www.nvidia.com/en-us/drivers/unix/"
      archive: "https://download.nvidia.com/XFree86/Linux-x86_64/"
    desired_formats:
      required: ["source_release", "deb_packages", "rpm_packages", "arch_packages", "checksums", "release_notes"]
      when_available: ["runfiles"]
    package_names:
      debian_family: ["nvidia-driver-440", "nvidia-driver-450", "nvidia-driver-470", "nvidia-driver-525", "nvidia-driver-535", "nvidia-driver-550", "nvidia-driver-570"]
      rpm_family: ["nvidia-driver", "akmod-nvidia", "xorg-x11-drv-nvidia"]
      arch_linux: ["nvidia", "nvidia-utils", "nvidia-dkms", "nvidia-open-dkms"]

  - id: cuda-toolkit
    category: nvidia-low-level
    priority: critical
    supported_epochs: ["E0", "E1", "E2", "E3", "E4"]
    upstream:
      home: "https://developer.nvidia.com/cuda-toolkit-archive"
    desired_formats:
      required: ["runfiles", "deb_packages", "rpm_packages", "arch_packages", "release_notes"]
    package_names:
      debian_family: ["cuda-toolkit-10-2", "cuda-toolkit-11-3", "cuda-toolkit-11-8", "cuda-toolkit-12-1", "cuda-toolkit-12-4", "cuda-toolkit-12-8"]
      rpm_family: ["cuda-toolkit-10-2", "cuda-toolkit-11-3", "cuda-toolkit-11-8", "cuda-toolkit-12-1", "cuda-toolkit-12-4", "cuda-toolkit-12-8"]
      arch_linux: ["cuda"]

