# Primary bulk upload: gdrive-registry.yaml → models/<relpath>/ on Drive
#   python3 upload_registry.py --dry-run
#   python3 backup.py list-registry
#   bash run-registry-upload.sh
models_mount: /mnt/models

archiver_root: /home/x/z/dev/model-archival/model-archival/model-archival
metadata_pending_path: /mnt/models/d3/gdrive_metadata_pending

gdrive:
  # If rclone.conf sets root_folder_id to the shared folder, use "gdrive:" only (do not repeat ID).
  remote: "gdrive:"
  base_path: ""
  transfers: 1
  checkers: 1
  # rclone bwlimit is bytes/s; cap uploads globally at ~2 MB/s.
  bwlimit: "2M"
  # Tracker-skipped dirs: run `rclone check --checksum --one-way` vs Drive before skipping (no full download).
  # Disable for a run: `backup-registry --no-verify-remote`
  registry_verify_remote: true

